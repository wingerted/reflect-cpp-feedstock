name: Release Conda Package

on:
  push:
    tags:
      - 'v*'  # 当推送以 v 开头的 tag 时触发

# 添加权限配置
permissions:
  contents: write  # 允许工作流创建 releases
  id-token: write  # 添加 id-token 写入权限

jobs:
  build:
    name: Build package
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target-platform: linux-64
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: prefix-dev/setup-pixi@v0.11.3
      with:
        pixi-version: v0.76.2
        locked: true

    - name: Build reflect-cpp
      run: pixi run build --target-platform ${{ matrix.target-platform }}

    - name: Test installed reflect-cpp
      run: pixi run test

    - uses: actions/upload-artifact@v4
      with:
        name: package-${{ matrix.target-platform }}
        path: output/linux-64/reflect-cpp-*.conda
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          output/linux-64/reflect-cpp-*.conda
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
      
    - name: Upload reflect-cpp
      shell: bash
      # do not upload on PR
      if: github.event_name == 'push'
      run: |
        # uses trusted publishers for the upload
        for file in output/linux-64/reflect-cpp-*.conda; do
          pixi run rattler-build upload prefix --skip-existing -c cxxlibs "$file"
        done
