context:
  version: 0.27.1

package:
  name: reflect-cpp
  version: ${{ version }}

source:
  url: https://github.com/munich-data-engineering/reflect-cpp/archive/refs/tags/v${{ version }}.tar.gz
  sha256: c50b221080687b42f852b58e651441d8130107ece17312218e5d31ce081206ea
  patches:
    - fix_system_arrow_target.patch

build:
  number: 2
  script: ./build.sh

requirements:
  build:
    - clang
    - clangxx
    - cmake
    - ninja
  host:
    - ctre >=3.10.0,<4
    - enchantum >=0.5.0,<0.6
    - yyjson >=0.12.0,<0.13
    - msgpack-c >=6.1.0,<7
    - flatbuffers >=25.1.21,<26
    - libbson >=1.23.2,<2
    - pugixml >=1.15,<2
    - yaml-cpp >=0.8.0,<0.9
    - tomlplusplus >=3.4.0,<4
    - pyarrow >=24.0.0,<25
  run:
    - ctre >=3.10.0,<4
    - enchantum >=0.5.0,<0.6
    - yyjson >=0.12.0,<0.13
    - msgpack-c >=6.1.0,<7
    - flatbuffers >=25.1.21,<26
    - libbson >=1.23.2,<2
    - pugixml >=1.15,<2
    - yaml-cpp >=0.8.0,<0.9
    - tomlplusplus >=3.4.0,<4
    - pyarrow >=24.0.0,<25

tests:
  - script: bash tests/run.sh
    requirements:
      run:
        - clangxx
        - cmake
        - ninja
    files:
      recipe:
        - tests/*

# 包的元数据
about:
  homepage: https://github.com/munich-data-engineering/reflect-cpp
  license: MIT
  license_file: LICENSE
  summary: A modern C++ reflection library
